[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syncore"
version = "0.1.0"
description = "Syncore - AI Shopping & Procurement Agent (Phase 1 Shopping Brain vertical slice)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Syncore Engineering" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "SQLAlchemy>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.26",
    "sse-starlette>=1.8",
    "cryptography>=43,<46",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.98",
    "ruff>=0.3",
    "mypy>=1.8",
    "httpx>=0.26",
]
postgres = ["psycopg[binary]>=3.1"]
llm = ["openai>=1.14"]
browser = ["playwright>=1.42"]

[project.scripts]
syncore-slice = "syncore.scripts.vertical_slice:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the curated seed catalog (and any other data) inside the wheel so a
# non-editable install (Docker) can still load it at runtime.
"syncore.master_agent" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
