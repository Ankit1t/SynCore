# Render Blueprint for the Syncore backend (FastAPI).
# Deploy: push to GitHub -> Render.com -> New + -> Blueprint -> pick this repo.
# Set LLM_API_KEY in the dashboard (marked sync:false = secret, not committed).
services:
  - type: web
    name: syncore-api
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn syncore.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: MARKETPLACE_MODE
        value: mock
      - key: BROWSER_MODE
        value: mock
      - key: CORS_ORIGINS
        value: "*"
      # --- LLM (any-item). Groq is the stable demo default. ---
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      # --- Payments (Razorpay TEST mode). Set both in the dashboard. ---
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # --- Live REAL product data (SerpApi Google Shopping). Optional. ---
      # Set this to fetch real, currently-listed products with live prices.
      # Without it, LIVE mode uses the DummyJSON demo API.
      - key: SERPAPI_KEY
        sync: false
      # For persistent data, add a free Postgres (Render/Neon) and set:
      # - key: DATABASE_URL
      #   value: postgresql+psycopg://...   (then build with pip install -e ".[postgres]")
